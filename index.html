<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:  #ECEEF3;
    --ink:    #10131A;
    --accent: #3F4AE8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #0E1015;
      --ink:    #EEF0F4;
      --accent: #7A82FF;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .mark {
    width: 96px; height: 96px;
    display: grid; place-items: center;
    background: var(--accent);
    border-radius: 28px;
  }

  h1 {
    margin: 0;
    font-size: clamp(34px, 8vw, 56px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="logo">
  <span class="mark" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 16 16" fill="none">
      <path d="M2 13V3l4 5 4-5v10" stroke="#fff" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12.5" cy="11.5" r="1.6" fill="#fff"/>
    </svg>
  </span>
  <h1>MakeITgame</h1>
</div>

</body>
